<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pitch Black Pack Pull</title><style>body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#ff4ecd,#6b38ff 30%,#07102f 75%);color:#fff;display:grid;place-items:center;min-height:100vh}.game{width:min(88vw,440px);background:linear-gradient(145deg,#17164f,#24105a,#071b4f);border:2px solid #65f5ff;border-radius:22px;padding:16px;box-shadow:0 0 25px #65f5ff55,0 18px 50px #000b;text-align:center}.game h1{font-size:25px}.game p{font-size:14px}.pack{margin:14px auto;width:130px;height:180px;border-radius:17px;background:radial-gradient(circle at 50% 28%,#ff55d9,#7d3cff 28%,#10104a 70%);border:3px solid #ffe65c;display:grid;place-items:center;font-weight:1000;font-size:19px;letter-spacing:1px;box-shadow:0 0 20px #ff4ecd88,0 10px 25px #0009}.pack span{color:#65f5ff}.btn{border:0;border-radius:13px;padding:11px 18px;font-weight:900;font-size:15px;cursor:pointer;background:linear-gradient(90deg,#ff4ecd,#7d5cff,#28e7ff);color:#fff;box-shadow:0 6px 18px #0006}.btn:active{transform:scale(.97)}.result{min-height:300px;margin:13px 0;padding:12px;border-radius:16px;background:linear-gradient(145deg,#090c2d,#17104a);border:1px solid #ffffff33}.opening{animation:pulse .65s ease-in-out}.pull{font-size:18px;font-weight:900}.mega{font-size:19px;font-weight:900;color:#ffd84d}.card-image{width:min(260px,75vw);height:auto;aspect-ratio:2.5/3.5;object-fit:contain;border-radius:11px;border:4px solid #ffe65c;box-shadow:0 12px 25px #000b,0 0 16px #65f5ff66;display:block;margin:6px auto 10px;background:#fff}.front-label{font-size:10px;font-weight:900;color:#65f5ff;letter-spacing:1px;margin:3px 0 6px}.stats{display:flex;justify-content:space-around;color:#ddd;margin:8px 0;font-size:13px}.small{font-size:11px!important;color:#bfc7ff}button:disabled{opacity:.5}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 25px #ff4ecd88}}</style></head><body><main class="game"><h1>🌑 Pitch Black Pack Pull</h1><p>Open packs and hunt the <b>Mega Darkrai ex — Mega Hyper Rare</b>!</p><div class="pack">PITCH<br><span>BLACK</span></div><div class="result" id="result">Press <b>OPEN PACK</b> to pull a card.</div><button class="btn" id="open" type="button">OPEN PACK</button><div class="stats"><div>Packs<br><b id="packs">0</b></div><div>Best streak<br><b id="streak">0</b></div><div>Hits<br><b id="hits">0</b></div></div><p class="small">Special-card odds: exactly 1 in 100 per pack (1%). This is only a game simulation—no real cards or money involved.</p></main><script>
document.addEventListener('DOMContentLoaded',()=>{
 let packs=0,hits=0,streak=0,best=0;
 const result=document.getElementById('result'),button=document.getElementById('open');
 const packsEl=document.getElementById('packs'),hitsEl=document.getElementById('hits'),streakEl=document.getElementById('streak');
 const cards=[["Tropius","Common"],["Grubbin","Common"],["Fomantis","Common"],["Lurantis ex","Double Rare"],["Poltchageist","Common"],["Sinistcha","Uncommon"],["Heatran","Uncommon"],["Mega Delphox ex","Double Rare"],["Sizzlipede","Common"],["Centiskorch","Common"],["Charcadet","Common"],["Armarouge","Rare"],["Goldeen","Common"],["Seaking","Uncommon"],["Wailmer","Common"],["Wailord ex","Double Rare"],["Relicanth","Uncommon"],["Popplio","Common"],["Brionne","Common"],["Primarina","Rare"],["Finizen","Common"],["Palafin","Uncommon"],["Electrike","Common"],["Manectric","Uncommon"],["Charjabug","Common"],["Vikavolt","Uncommon"],["Mega Zeraora ex","Double Rare"],["Miraidon","Rare"],["Slowpoke","Common"],["Slowbro","Uncommon"],["Mega Slowbro ex","Double Rare"],["Jynx","Common"],["Shuppet","Common"],["Banette","Uncommon"],["Spiritomb","Rare"],["Litwick","Common"],["Lampent","Uncommon"],["Mega Chandelure ex","Double Rare"],["Dhelmise","Uncommon"],["Marshadow","Uncommon"],["Annihilape","Uncommon"],["Mankey","Common"],["Primeape","Common"],["Cranidos","Common"],["Rampardos ex","Double Rare"],["Drilbur","Common"],["Koraidon","Rare"],["Mega Darkrai ex","Double Rare"],["Vullaby","Common"],["Mandibuzz","Common"],["Inkay","Common"],["Malamar","Uncommon"],["Nickit","Common"],["Thievul","Uncommon"],["Morpeko ex","Double Rare"],["Zarude","Rare"],["Maschiff","Common"],["Mabosstiff","Common"],["Chi-Yu","Rare"],["Skarmory","Common"],["Shieldon","Common"],["Bastiodon","Rare"],["Bronzor","Common"],["Bronzong","Uncommon"],["Mega Excadrill ex","Double Rare"],["Pikipek","Common"],["Trumbeak","Common"],["Toucannon","Uncommon"],["Type: Null","Common"],["Silvally","Rare"],["Bombirdier","Common"],["Antique Armor Fossil","Common"],["Antique Skull Fossil","Common"],["Backtrack Badge","Uncommon"],["Dark Bell","Uncommon"],["Fossil Quarry","Uncommon"],["Gladion’s Final Battle","Uncommon"],["Gwynn","Uncommon"],["Jett","Uncommon"],["Misty’s Vitality","Uncommon"],["Rust Syndicate Grunt","Uncommon"],["Tremendous Bomb","Uncommon"],["Shadowy Darkness Energy","Rare"],["Voltaic Lightning Energy","Rare"],["Fomantis","Illustration Rare"],["Armarouge","Illustration Rare"],["Goldeen","Illustration Rare"],["Primarina","Illustration Rare"],["Manectric","Illustration Rare"],["Slowbro","Illustration Rare"],["Dhelmise","Illustration Rare"],["Thievul","Illustration Rare"],["Bastiodon","Illustration Rare"],["Toucannon","Illustration Rare"],["Silvally","Illustration Rare"],["Lurantis ex","Ultra Rare"],["Wailord ex","Ultra Rare"],["Mega Zeraora ex","Ultra Rare"],["Mega Chandelure ex","Ultra Rare"],["Rampardos ex","Ultra Rare"],["Mega Darkrai ex","Ultra Rare"],["Morpeko ex","Ultra Rare"],["Mega Excadrill ex","Ultra Rare"],["Brave Bangle","Ultra Rare"],["Crushing Hammer","Ultra Rare"],["Dark Bell","Ultra Rare"],["Energy Switch","Ultra Rare"],["Gladion’s Final Battle","Ultra Rare"],["Gwynn","Ultra Rare"],["Iron Defender","Ultra Rare"],["Misty’s Vitality","Ultra Rare"],["Rust Syndicate Grunt","Ultra Rare"],["Tremendous Bomb","Ultra Rare"],["Mega Zeraora ex","Special Illustration Rare"],["Mega Chandelure ex","Special Illustration Rare"],["Mega Darkrai ex","Special Illustration Rare"],["Morpeko ex","Special Illustration Rare"],["Gladion’s Final Battle","Special Illustration Rare"],["Gwynn","Special Illustration Rare"],["Mega Darkrai ex","Mega Hyper Rare"]];
 function showCard(card,number,isSpecial){
   if(isSpecial){
     result.innerHTML='<div class="front-label">🎨 CUSTOM NON-GOLD CARD FRONT</div><div style="width:min(300px,85vw);aspect-ratio:2.5/3.5;margin:8px auto;padding:12px;border:6px solid #63eaff;border-radius:16px;box-sizing:border-box;background:radial-gradient(circle at 50% 35%,#5d5ce7,#191b50 60%,#08091b);color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:center;box-shadow:inset 0 0 0 3px #c6b8ff,0 0 24px #63eaff66"><div style="display:flex;justify-content:space-between;font-size:10px;font-weight:900"><span>MEGA EVOLUTION</span><span>HP 280</span></div><div style="font-size:85px;filter:drop-shadow(0 5px 8px #0008)">🌑</div><b style="font-size:20px">MEGA DARKRAI ex</b><div style="background:#ffffff17;border:1px solid #ffffff44;padding:8px;border-radius:8px;font-weight:900">DUSK RAID · 110+<br>ABYSS EYE</div><b style="font-size:11px;color:#aaf5ff">MEGA HYPER RARE · 120/084</b></div><div class="mega">🌑 MEGA DARKRAI ex — MEGA HYPER RARE! ✨</div><p>🎉 You hit the special 1-in-100 card!</p>';
   }else{
     result.innerHTML='<div class="front-label">🎨 CARD FRONT</div><img class="card-image" loading="eager" src="https://images.pokemontcg.io/me05/'+number+'.png" alt="'+card[0]+' card front, '+String(number).padStart(3,'0')+'/084" onerror="this.alt=\'Card front unavailable for this card\';this.src=\'https://images.pokemontcg.io/me05/'+number+'_hires.png\'"><div class="pull">🃏 <b>'+card[0]+' — '+String(number).padStart(3,'0')+'/084</b><br>'+card[1]+'</div><p>✨ Card #'+number+' pulled!</p>';
   }
 }
 button.addEventListener('click',()=>{
   button.disabled=true;packs++;packsEl.textContent=packs;
   result.classList.add('opening');result.innerHTML='<div style="font-size:22px;font-weight:900">📦 Opening pack...</div><p>✨ Revealing your card...</p>';
   setTimeout(()=>{
     const hit=Math.floor(Math.random()*100)===0;result.classList.remove('opening');
     if(hit){hits++;streak++;best=Math.max(best,streak);showCard(cards[119],120,true)}
     else{streak=0;const number=Math.floor(Math.random()*119)+1;showCard(cards[number-1],number,false)}
     hitsEl.textContent=hits;streakEl.textContent=best;button.disabled=false;button.textContent='OPEN ANOTHER PACK';
   },450);
 });
});
</script></body></html>
