<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pitch Black Pack Pull</title><style>body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#ff4ecd,#6b38ff 30%,#07102f 75%);color:#fff;display:grid;place-items:center;min-height:100vh}.game{width:min(88vw,440px);background:linear-gradient(145deg,#17164f,#24105a,#071b4f);border:2px solid #65f5ff;border-radius:22px;padding:16px;box-shadow:0 0 25px #65f5ff55,0 18px 50px #000b;text-align:center}.game h1{font-size:25px}.game p{font-size:14px}.pack{margin:14px auto;width:130px;height:180px;border-radius:17px;background:radial-gradient(circle at 50% 28%,#ff55d9,#7d3cff 28%,#10104a 70%);border:3px solid #ffe65c;display:grid;place-items:center;font-weight:1000;font-size:19px;letter-spacing:1px;box-shadow:0 0 20px #ff4ecd88,0 10px 25px #0009}.pack span{color:#65f5ff}.btn{border:0;border-radius:13px;padding:11px 18px;font-weight:900;font-size:15px;cursor:pointer;background:linear-gradient(90deg,#ff4ecd,#7d5cff,#28e7ff);color:#fff;box-shadow:0 6px 18px #0006}.btn:active{transform:scale(.97)}.result{min-height:300px;margin:13px 0;padding:12px;border-radius:16px;background:linear-gradient(145deg,#090c2d,#17104a);border:1px solid #ffffff33}.opening{animation:pulse .65s ease-in-out}.pull{font-size:18px;font-weight:900}.mega{font-size:19px;font-weight:900;color:#ffd84d}.card-image{width:min(260px,75vw);height:auto;aspect-ratio:2.5/3.5;object-fit:contain;border-radius:11px;border:4px solid #ffe65c;box-shadow:0 12px 25px #000b,0 0 16px #65f5ff66;display:block;margin:6px auto 10px;background:#fff}.front-label{font-size:10px;font-weight:900;color:#65f5ff;letter-spacing:1px;margin:3px 0 6px}.stats{display:flex;justify-content:space-around;color:#ddd;margin:8px 0;font-size:13px}.small{font-size:11px!important;color:#bfc7ff}button:disabled{opacity:.5}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 25px #ff4ecd88}}</style></head><body><main class="game"><h1>🌑 Pitch Black Pack Pull</h1><p>Open packs and hunt the <b>Mega Darkrai ex — Mega Hyper Rare</b>!</p><div class="pack">PITCH<br><span>BLACK</span></div><div class="result" id="result">Press <b>OPEN PACK</b> to pull a card.</div><button class="btn" id="open" type="button">OPEN PACK</button><div class="stats"><div>Packs<br><b id="packs">0</b></div><div>Best streak<br><b id="streak">0</b></div><div>Hits<br><b id="hits">0</b></div></div><p class="small">Special-card odds: exactly 1 in 100 per pack (1%). This is only a game simulation—no real cards or money involved.</p></main><script>document.addEventListener('DOMContentLoaded',()=>{let packs=0,hits=0,currentStreak=0,bestStreak=0;const result=document.getElementById('result'),button=document.getElementById('open'),packsEl=document.getElementById('packs'),hitsEl=document.getElementById('hits'),streakEl=document.getElementById('streak');const cards=[{name:'Goldeen — 013/084',rarity:'Common',emoji:'🐟',theme:'water'},{name:'Sinistcha — 006/084',rarity:'Uncommon',emoji:'🍵',theme:'green'},{name:'Armarouge — 012/084',rarity:'Rare',emoji:'🔥',theme:'fire'},{name:'Mega Darkrai ex — 048/084',rarity:'Double Rare',emoji:'🌑',theme:'dark'},{name:'Goldeen — 087/084',rarity:'Illustration Rare',emoji:'🐟',theme:'water'}];function drawCard(c){const colors={water:['#c6f7ff','#169ed8','#07558f'],green:['#e1ffc9','#53b95b','#1a6542'],fire:['#fff0bd','#ff9145','#a52b38'],dark:['#c6b5ff','#6036bd','#171044']};const p=colors[c.theme];return '<div class="front-label">🎨 CARD FRONT</div><div style="width:min(250px,75vw);margin:6px auto 10px;padding:5px;border-radius:13px;background:linear-gradient(135deg,#ffe65c,#65f5ff,#ff4ecd);box-shadow:0 0 18px #65f5ff66;box-sizing:border-box"><div style="aspect-ratio:2.5/3.5;border-radius:9px;padding:9px;box-sizing:border-box;text-align:left;color:#10102b;background:linear-gradient(155deg,'+p[0]+','+p[1]+' 55%,'+p[2]+');display:flex;flex-direction:column;overflow:hidden"><div 70" cy="91" r="6" fill="#123b68"/><circle cx="108" cy="91" r="6" fill="#123b68"/><path d="M79 108 Q90 116 101 108" fill="none" stroke="#123b68" stroke-width="4"/><path d="M68 55 Q89 34 112 56" fill="none" stroke="#ffe5f0" stroke-width="7" stroke-linecap="round"/></svg>':c.theme==='fire'?'<svg viewBox="0 0 180 180" width="150" height="150"><path d="M91 19 Q122 49 107 68 Q144 53 143 91 Q150 131 92 148 Q39 145 39 101 Q40 74 66 57 Q61 87 80 88 Q102 64 91 19Z" fill="#ff9c47" stroke="#8b2938" stroke-width="5"/><path d="M92 78 Q113 98 97 126 Q72 130 69 107 Q70 92 92 78Z" fill="#ffe78a"/><circle cx="72" cy="92" r="5" fill="#542d42"/><circle cx="109" cy="92" r="5" fill="#542d42"/><path d="M82 108 Q91 115 100 108" fill="none" stroke="#542d42" stroke-width="4" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 180 180" width="150" height="150"><path d="M89 21 Q119 31 122 59 Q157 73 143 110 Q132 143 91 149 Q45 143 37 108 Q27 76 60 57 Q60 32 89 21Z" fill="#45336f" stroke="#171044" stroke-width="6"/><path d="M58 63 Q35 34 53 24 Q78 29 81 58 M117 60 Q143 28 157 47 Q154 72 126 82" fill="#6c4dd2" stroke="#171044" stroke-width="5"/><ellipse cx="72" cy="91" rx="7" ry="10" fill="#b9f4ff"/><ellipse cx="108" cy="91" rx="7" ry="10" fill="#b9f4ff"/><path d="M79 112 Q91 104 103 112" fill="none" stroke="#b9f4ff" stroke-width="4"/><path d="M53 123 L34 143 M127 123 L147 143" stroke="#6c4dd2" stroke-width="9" stroke-linecap="round"/></svg>')+'</div>'<div style="background:#ffffffdf;border-radius:6px;padding:7px;text-align:center;font-weight:900;font-size:11px">'+(c.theme==='dark'?'NIGHT IMPACT • 120':'SPECIAL ATTACK • 30')+'<br><span style="font-size:9px">'+c.rarity.toUpperCase()+' • '+c.name.split(' — ')[1]+'</span></div></div></div><div class="pull">🃏 <b>'+c.name+'</b></div><p>✨ '+c.rarity+' pull!</p>'}button.addEventListener('click',()=>{button.disabled=true;packs++;packsEl.textContent=packs;result.classList.add('opening');result.innerHTML='<div style="font-size:20px;font-weight:900">📦 Opening pack...</div><p>✨ Revealing your card...</p>';setTimeout(()=>{const hit=Math.floor(Math.random()*100)===0;result.classList.remove('opening');if(hit){hits++;currentStreak++;bestStreak=Math.max(bestStreak,currentStreak);result.innerHTML=drawCard({name:'Mega Darkrai ex — 120/084',rarity:'Mega Hyper Rare',emoji:'🌑✨',theme:'dark'}).replace('✨ Mega Hyper Rare pull!','🎉 You hit the 1-in-100 card!')}else{currentStreak=0;const card=cards[Math.floor(Math.random()*cards.length)];result.innerHTML=drawCard(card)}hitsEl.textContent=hits;streakEl.textContent=bestStreak;button.disabled=false;button.textContent='OPEN ANOTHER PACK'},450)})});</script></body></html>
